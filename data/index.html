<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>제일푸드 자료함</title>
<meta name="theme-color" content="#1D4A36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제일푸드 자료함">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#1D4A36}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F6F1E7}
.msg{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;text-align:center;padding:80px 24px;line-height:1.6}
</style>
</head>
<body>
<div class="msg" id="msg" hidden>제일푸드 자료함<br>올바르지 않은 링크입니다.<br>담당자에게 문의해 주세요.</div>
<script>
(function(){
  var APP='https://script.google.com/macros/s/AKfycbyZCHPVtv0FjDE1srBPtTe2R7BaDIJO38TRBe5qyhP1xFVtPfYdUWf4_BSwjDIPhoLLmw/exec';
  var k=new URLSearchParams(location.search).get('k')||'';
  try{ if(k) localStorage.setItem('jeil_data_k',k); else k=localStorage.getItem('jeil_data_k')||''; }catch(e){}
  if(!/^[0-9a-f]{16}$/.test(k)){ document.getElementById('msg').hidden=false; return; }
  var f=document.createElement('iframe');
  f.src=APP+'?data='+encodeURIComponent(k);
  f.allow='clipboard-write';
  f.title='제일푸드 자료함';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
